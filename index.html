<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База знаний преподавателя — Квантастика</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #4A2E9E;
      --primary-soft: #6B4FC4;
      --primary-light: #8F7AD6;
      --primary-pale: #EDE8F8;
      --primary-dark: #2E1B6E;
      --bg: #F7F5FC;
      --white: #FFFFFF;
      --text: #2D2D3A;
      --text-light: #7A7A8E;
      --sidebar-width: 280px;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(74, 46, 158, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
    }

    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(160deg, #D5CCF0, #EDE8F8, #F7F5FC);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }
    .login-overlay.hidden { opacity: 0; pointer-events: none; }
    .login-box {
      background: var(--white);
      border-radius: 20px;
      padding: 40px;
      width: 400px;
      box-shadow: 0 12px 48px rgba(74, 46, 158, 0.15);
      text-align: center;
    }
    .login-box h2 {
      font-size: 26px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #2E1B6E, #4A2E9E, #6B4FC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
    .login-box p { color: var(--text-light); margin-bottom: 24px; font-size: 14px; }
    .login-input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid #D5CCF0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
      background: var(--bg);
    }
    .login-input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(74, 46, 158, 0.08); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4A2E9E, #6B4FC4);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-error { color: #C46B6B; font-size: 13px; margin-top: 12px; display: none; }

    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, #EDE8F8, #F7F5FC);
      color: var(--text);
      padding: 28px 14px 40px;
      overflow-y: auto;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
      border-right: 1px solid #D5CCF0;
    }
    .sidebar-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
      padding: 0 10px;
      background: linear-gradient(135deg, #2E1B6E, #4A2E9E, #6B4FC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar-subtitle {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 18px;
      padding: 0 10px;
    }
    .role-badge {
      display: inline-block;
      background: var(--primary-pale);
      color: var(--primary-dark);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      margin: 0 10px 14px;
      font-weight: 600;
    }
    .role-badge.admin { background: var(--primary-light); color: var(--white); font-weight: 700; }
    .logout-btn {
      display: block;
      width: calc(100% - 20px);
      margin: 0 10px 20px;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--primary-light);
      color: var(--primary-dark);
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .logout-btn:hover { background: var(--primary-pale); }

    .menu-section { margin-bottom: 6px; }
    .menu-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--primary-dark);
      cursor: pointer;
      border-radius: 10px;
      user-select: none;
    }
    .menu-section-header:hover { background: var(--primary-pale); }
    .menu-section-header .arrow {
      transition: transform 0.3s ease;
      font-size: 11px;
      color: var(--primary-light);
    }
    .menu-section.open .menu-section-header .arrow { transform: rotate(90deg); }
    .menu-section-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }
    .menu-section.open .menu-section-content { max-height: 3000px; }
    .menu-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 7px 14px 7px 22px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .menu-item:hover { background: var(--primary-pale); color: var(--primary-dark); }
    .menu-item.active {
      background: var(--primary-light);
      color: var(--white);
      font-weight: 600;
    }
    .menu-item.sub { padding-left: 30px; }

    .home-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
    }
    .home-hero h1 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 36px;
      background: linear-gradient(135deg, #2E1B6E, #4A2E9E, #6B4FC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .home-hero .search-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 18px 28px;
      border: 1px solid #D5CCF0;
      border-radius: 28px;
      font-size: 16px;
      outline: none;
      background: var(--white);
      text-align: left;
      box-shadow: 0 2px 12px rgba(74, 46, 158, 0.08);
    }
    .search-input:focus { border-color: var(--primary-light); box-shadow: 0 4px 20px rgba(74, 46, 158, 0.15); }
    .search-suggestions {
      list-style: none;
      background: var(--white);
      border: 1px solid #D5CCF0;
      border-radius: 16px;
      margin-top: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(74, 46, 158, 0.15);
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 200;
      max-height: 300px;
      overflow-y: auto;
    }
    .search-suggestions li {
      padding: 12px 24px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--primary-pale);
    }
    .search-suggestions li:hover { background: var(--primary-pale); }

    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 48px 48px 80px;
      max-width: 1200px;
    }
    .content-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px 32px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .content-card h3 { color: var(--primary-dark); margin-bottom: 12px; font-size: 19px; }
    .content-card h4 { color: var(--primary-dark); margin: 16px 0 8px; font-size: 16px; }
    .content-card p, .content-card li { font-size: 14.5px; margin-bottom: 8px; }
    .content-card ul, .content-card ol { padding-left: 22px; margin-bottom: 12px; }
    .btn {
      display: inline-block;
      background: var(--primary-pale);
      color: var(--primary-dark);
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-light); color: var(--white); }
    .template-box {
      background: var(--primary-pale);
      border-left: 4px solid var(--primary);
      padding: 16px 20px;
      border-radius: 10px;
      margin: 10px 0;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .constructor-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .constructor-row select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #D5CCF0;
      font-size: 13.5px;
      min-width: 200px;
      background: var(--white);
    }
    .copy-btn {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12.5px;
      margin-top: 8px;
    }

    .edit-mode .content-card {
      outline: 2px dashed var(--primary-light);
      outline-offset: -2px;
      cursor: text;
      min-height: 50px;
    }
    .edit-toolbar {
      display: none;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
    }
    .edit-toolbar.visible { display: flex; }
    .edit-toolbar button {
      background: var(--primary-pale);
      color: var(--primary-dark);
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .save-btn {
      background: #7DB87A;
      color: var(--white);
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .edit-status { font-size: 12.5px; color: var(--text-light); }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 24px 20px 60px; }
      .home-hero h1 { font-size: 26px; }
    }
  </style>
</head>

        'home': { title: '', html: `<div class="home-hero"><h1>База знаний школы программирования Квантастика</h1><div class="search-container"><input type="text" id="global-search" class="search-input" placeholder="Поиск по базе знаний"><ul class="search-suggestions hidden" id="suggestions"></ul></div></div>` },
        'new-employee': { title: 'Новым сотрудникам', html: `<div class="content-card" data-editable="true"><h3>Первые шаги</h3><p>Изучите регламент, чек-лист преподавателя и полезные ссылки. Если останутся вопросы — обратитесь к старшему преподавателю.</p></div>` },
        'checklist': { title: 'Чек-лист преподавателя', html: `<div class="content-card" data-editable="true"><h3>Чек-лист преподавателя</h3><p>Этот чек-лист поможет вам организовать свою работу и ничего не забыть. Он разбит на три логических блока: подготовка перед уроком, действия во время урока и завершающие шаги после урока.</p><h4>Перед уроком (за 15-30 минут)</h4><ul><li>Проверьте расписание в Alfa CRM — убедитесь, что у вас нет ошибок в дате и времени урока. Проверьте состав группы и ФИО учеников.</li><li>Подготовьте методические материалы — откройте презентацию, методичку и дополнительные задания.</li><li>Проверьте работоспособность программ — запустите нужные программы (Scratch, Unity, Stencyl и т.д.).</li><li>Зайдите в Alfa CRM и ERP систему — проверьте, что урок отображается в системе.</li><li>Продумайте свой внешний вид и фон — для Контур.Толк важно, чтобы фон был нейтральным, а освещение — хорошим.</li><li>Напишите напоминание в чат группы ТГ — за 5-15 минут до урока отправьте сообщение о начале занятия.</li></ul><h4>Во время урока</h4><ul><li>Вовлекайте всех учеников в диалог — задавайте вопросы, просите высказывать мнения.</li><li>Следите за таймингом — контролируйте, чтобы каждый этап урока укладывался в отведённое время.</li><li>Помогайте слабым ученикам — уделяйте им больше внимания, разбивайте задания на простые шаги.</li><li>Давайте дополнительные задания сильным ученикам.</li><li>Контролируйте уровень шума — используйте сигналы тишины или сделайте паузу.</li><li>Хвалите учеников за успехи.</li><li>Начисляйте КодКойны.</li></ul><h4>После урока (в течение 30 минут)</h4><ul><li>Нажмите кнопку «Завершить урок» в ERP-системе.</li><li>Заполните отчет в Alfa CRM.</li><li>Отправьте обратную связь родителям в Telegram.</li><li>Проверьте домашние задания.</li><li>Назначьте отработки при необходимости.</li><li>Запишите вопросы и сложности для обсуждения с руководителем.</li></ul><h4>Тайминг уроков</h4><ul><li>Индивидуальный/нулевой урок — 60 минут.</li><li>Групповой урок (2+ детей) — 90 минут.</li><li>Групповой урок (1 ученик) — 60 минут.</li><li>Отработка — 30 минут.</li></ul></div>` },
        'otrabotka': { title: 'Как назначить отработку', html: `<div class="content-card" data-editable="true"><h3>Как назначить отработку</h3><p>Перед тем, как назначить отработку предложите ученику/родителю попробовать самостоятельно изучить материал через видеоролик. Если у него останутся вопросы или что-то не будет получаться, то назначьте ему отработку.</p><h4>Пошаговый алгоритм действий:</h4><ol><li>Договориться с родителем/учеником на нужное время и дату.</li><li>Заполнить таблицу назначение отработок.</li><li>Написать в чат битрикса «педагоги и админы» номер строки.</li><li>В альфу добавить отработку.</li><li>Укажите: дату, время, время урока 30 минут, ФИ ученика.</li></ol></div>` },
        'tech-help': { title: 'Как назначить техническую помощь', html: `<div class="content-card" data-editable="true"><h3>Как назначить техническую помощь ученику</h3><ol><li>Зайдите в реестр технической помощи для учеников и заполните заявку по форме.</li><li>Напишите в чат битрикса педагоги и админы, о том что вы заполнили реестр.</li></ol><p>Важный момент: чем подробнее вы опишите проблему и то как вы попытались помочь тем лучше. Также пропишите, когда следующий урок с учеником.</p></div>` },
        'templates': { title: 'Шаблонные сообщения', html: `<div class="content-card"><h3>Конструктор шаблонных сообщений</h3><div class="constructor-row"><select id="course-select"><option value="">— Курс —</option><option>Junior</option><option>Middle</option><option>High</option><option>Нейросети</option><option>Графический дизайн</option></select><select id="module-select" disabled><option value="">— Модуль —</option></select><select id="lesson-select" disabled><option value="">— Урок —</option></select></div><div id="template-output" class="template-box">Выберите курс, модуль и урок</div><button id="copy-template" class="copy-btn">Скопировать текст</button></div>` },
        'leave': { title: 'Отгулы/замены/отпуска', html: `<div class="content-card" data-editable="true"><h3>Отгулы/замены/отпуска</h3><h4>Как мне взять отгул?</h4><p>В случае любой замены, кроме форс-мажорной, заполняем форму. В ней есть вся нужная информация, ответы на вопросы и ссылка на регламент.</p><h4>Не могу прямо сейчас, до урока осталось меньше часа выйти на урок (форс-мажор), что делать?</h4><p>СРОЧНО написать администраторам в Telegram и в чат Битрикс «ПЕДАГОГИ и АДМИНЫ». И написать своему старшему преподавателю.</p></div>` },
        'video-lesson': { title: 'Где взять запись/видеоролик по уроку', html: `<div class="content-card" data-editable="true"><h3>Где найти запись урока</h3><p>Если вы заходите в личный кабинет через сайт «Квантастика», следуйте пункту 1. Если вы заходите в личный кабинет через сайт «КодКласс», лучше перейдите на сайт «Квантастика» или следуйте пункту 2.</p><h4>Пункт 1</h4><p>Личный кабинет: lk.kvantastica.ru/login → Домашнее задание → задание к последнему уроку → Материалы урока → Видео урок.</p><h4>Пункт 2</h4><p>Личный кабинет: erp.code-class.ru/login → Домашнее задание → задание к последнему уроку → прокрутите до конца страницы → Видео урок.</p><p>Если у вас нет видеоурока в личном кабинете, напишите мне.</p></div>` },
        'links': { title: 'Полезные ссылки', html: `<div class="content-card" data-editable="true"><h3>Полезные ссылки</h3><ol><li>ERP система: erp.kvantastica.ru/admin/teacher-study</li><li>Alfa CRM: codeclassonline.s20.online</li><li>GetCourse: codeclass.getcourse.ru</li><li>Регламент: docs.google.com/document/d/1LT7TEvnjLeL7hSIcS8XwF9egDnijkx23/edit</li><li>Реестр технической помощи: docs.google.com/spreadsheets/d/18wsaUhfDwnM3hzfBxnNcz4iqgz-QmS5u86NPgZOc_io/edit</li><li>Реестр отработок: docs.google.com/spreadsheets/d/1xz81gD8lKhn-ff2ToQuxosLcp84uU0-wIIaUiQo9_dc/edit</li><li>Форма обмена кодкоинов: forms.gle</li><li>Форма замен: forms.gle</li><li>Okdesk: codeclass.okdesk.ru</li></ol></div>` },
        'regulations': { title: 'Регламент преподавателя', html: `<div class="content-card" data-editable="true"><h3>Регламент организации работы преподавателя программирования</h3><h4>1. Общие положения</h4><p>Регламент представляет собой свод правил и действий, благодаря которым в компании поддерживается система.</p><p>Работа преподавателя заключается в проведении нулевых уроков, индивидуальных и групповых регулярных уроков, отработок, технической помощи.</p><p>Ключевые цели: сохраняемость клиентов — не ниже 95%, посещаемость занятий — не ниже 90%.</p><p>Руководитель отдела преподавателей — Алина Комарова.</p><h4>2. Обязанности преподавателя</h4><p>Обучить детей всем новым понятиям, проводить каждый этап урока по методическим указаниям, следить за готовыми проектами, поддерживать дисциплину, проводить урок с включенной камерой.</p><h4>3. Задачи преподавателя</h4><p>Подготовка дома: пройти урок как ученик, изучить методические указания, решить все задания, выполнить домашнее задание, продумать внешний вид.</p><h4>4. Обучение и дообучение</h4><p>Перед началом работы преподаватель обязан пройти обучение на GetКурсе. В течение 3 месяцев пройти дообучение по всем предметам.</p><h4>5. Запрещенные действия</h4><p>Работать в конкурентных школах, проводить платные занятия с учениками школы, распространять методические материалы.</p><h4>Тайминг уроков</h4><ul><li>Индивидуальный/нулевой — 60 минут.</li><li>Групповой (2+ детей) — 90 минут.</li><li>Групповой (1 ученик) — 60 минут.</li><li>Отработка — 30 минут.</li><li>Техническая помощь — 30-60 минут.</li></ul></div>` },
        'strong': { title: 'Как работать с сильными учениками', html: `<div class="content-card" data-editable="true"><h3>Как работать с сильными учениками</h3><p><strong>Почему сильные ученики теряют интерес</strong></p><p>Самая частая ошибка преподавателя — дать сильному ученику задание «подождать, пока остальные закончат». Это убивает мотивацию.</p><h4>Стратегия 1. Дополнительные задания</h4><p>Дополнительное задание должно быть логическим продолжением текущей темы.</p><h4>Стратегия 2. Сделайте их помощниками</h4><p>Сильные ученики любят чувствовать себя значимыми. Попросите их помочь отстающим ученикам.</p><h4>Стратегия 3. Открытые вопросы и исследования</h4><p>Вместо готового задания спросите: «А что будет, если сделать иначе?»</p><h4>Стратегия 4. Система бонусов и Кодкоинов</h4><p>За выполнение дополнительных заданий начисляйте Кодкоины.</p><h4>Стратегия 5. Индивидуальные проекты</h4><p>Если сильный ученик хочет сделать что-то своё, позвольте ему.</p></div>` },
        'weak': { title: 'Как работать со слабыми учениками', html: `<div class="content-card" data-editable="true"><h3>Как работать со слабыми учениками</h3><p>Слабый ученик — это не «безнадёжный» случай. Это ученик, которому нужен другой подход.</p><h4>Два подхода к работе</h4><p><strong>Работа на общем экране:</strong> показывайте каждый шаг.</p><p><strong>Индивидуальная помощь за экраном:</strong> подключайтесь к экрану ученика.</p><h4>Пошаговая инструкция</h4><ol><li>Выясните, что именно он не понимает</li><li>Разбейте задачу на микро-шаги</li><li>Покажите один шаг, дайте сделать</li><li>Хвалите каждый маленький шаг</li><li>Повторяйте</li><li>Дайте время на самостоятельную практику</li></ol></div>` },
        'problem': { title: 'Как работать с проблемными учениками', html: `<div class="content-card" data-editable="true"><h3>Как работать с проблемными учениками</h3><p>Прежде чем реагировать, попробуйте понять причину.</p><h4>Стратегии</h4><ul><li>Сохраняйте спокойствие</li><li>Чёткие правила</li><li>Отделяйте поведение от личности</li><li>Давайте выбор</li><li>Используйте паузы</li><li>Обсуждайте проблемы наедине</li><li>Устанавливайте позитивную связь</li></ul></div>` },
        'noisy': { title: 'Как работать с шумными учениками', html: `<div class="content-card" data-editable="true"><h3>Как работать с шумными учениками</h3><h4>Стратегии</h4><ul><li>Введите сигнал тишины</li><li>Говорите тише</li><li>Вовлекайте в диалог</li><li>Правильная рассадка</li><li>Активные перерывы</li><li>Чёткая структура урока</li><li>Метод «выключенного микрофона»</li></ul></div>` },
        'quiet': { title: 'Как работать с тихими учениками', html: `<div class="content-card" data-editable="true"><h3>Как работать с тихими учениками</h3><h4>Стратегии</h4><ul><li>Задавайте вопросы в личку</li><li>Хвалите их ответы</li><li>Давайте время на размышление</li><li>Создайте безопасную среду</li><li>Используйте письменные задания</li><li>Обращайтесь по имени</li><li>Создавайте ситуации успеха</li></ul></div>` },
        'group': { title: 'Как проводить групповые уроки', html: `<div class="content-card" data-editable="true"><h3>Как проводить групповые уроки</h3><h4>Структура</h4><ul><li>Вступление (5-10 минут)</li><li>Теория (15-20 минут)</li><li>Практика с преподавателем (20-25 минут)</li><li>Самостоятельная работа (20-25 минут)</li><li>Заключение (5-10 минут)</li></ul><h4>Стратегии</h4><ul><li>Работайте со всей группой</li><li>Используйте парную работу</li><li>Делайте общие демонстрации</li><li>Не ждите, что все сделают одновременно</li><li>Контролируйте тайминг</li></ul></div>` },
        'motivation': { title: 'Как мотивировать учеников', html: `<div class="content-card" data-editable="true"><h3>Как мотивировать учеников</h3><h4>Стратегии</h4><ul><li>Показывайте результат</li><li>Связывайте с реальностью</li><li>Используйте игровые элементы</li><li>Начисляйте Кодкоины</li><li>Хвалите публично и в личку</li><li>Давайте право выбора</li><li>Используйте проектную работу</li></ul></div>` },
        'feedback': { title: 'Как давать обратную связь', html: `<div class="content-card" data-editable="true"><h3>Как давать обратную связь</h3><h4>Правила</h4><ul><li>Хвалите процесс, а не результат</li><li>Будьте конкретными</li><li>Указывайте на ошибки конструктивно</li><li>Хвалите до критики (сэндвич-метод)</li><li>Задавайте наводящие вопросы</li><li>Завершайте на позитиве</li></ul></div>` },
        'late': { title: 'Что делать если ученик опоздал', html: `<div class="content-card" data-editable="true"><h3>Что делать, если ученик опоздал</h3><p><strong>До 15 минут:</strong> впустите, дайте материалы, не останавливайте урок.</p><p><strong>15-30 минут:</strong> кратко объясните суть.</p><p><strong>Более 30 минут:</strong> предложите быть зрителем и выполнить по записи.</p><p><strong>Систематические опоздания:</strong> профилактическая беседа.</p></div>` },
        'ignore': { title: 'Ученик игнорирует преподавателя', html: `<div class="content-card" data-editable="true"><h3>Ученик игнорирует преподавателя</h3><h4>Алгоритм действий</h4><ol><li>Узнайте причину</li><li>Предложите индивидуальный подход</li><li>Настройте контакт отдельным разговором</li><li>Проверьте техническую сторону</li><li>Обратитесь к руководителю</li></ol></div>` },
        'mixed-levels': { title: 'Разные уровни подготовки в группе', html: `<div class="content-card" data-editable="true"><h3>Разные уровни подготовки в группе</h3><h4>Стратегии</h4><ul><li>Давайте задания с разной сложностью</li><li>Используйте пары</li><li>Не ждите, что все закончат одновременно</li><li>Индивидуальные консультации</li><li>Регулярно проверяйте понимание</li></ul></div>` },
        'attention': { title: 'Управление вниманием на уроке', html: `<div class="content-card" data-editable="true"><h3>Управление вниманием на уроке</h3><h4>Методы</h4><ul><li>Вовлекайте в диалог</li><li>Меняйте активность</li><li>Обращайтесь по имени</li><li>Используйте визуальные материалы</li><li>Делайте короткие перерывы</li><li>Используйте неожиданные вопросы</li><li>Связывайте с жизнью</li></ul></div>` },
        'crying': { title: 'Что делать если ученик заплакал', html: `<div class="content-card" data-editable="true"><h3>Что делать, если ребёнок заплакал на уроке</h3><h4>Алгоритм действий</h4><ol><li>Заметить и не игнорировать</li><li>Переключиться в личный чат</li><li>Спросить спокойным голосом</li><li>Принять эмоцию</li><li>Предложить решение</li><li>Дать время успокоиться</li><li>После урока связаться с родителями</li></ol></div>` },
        'training': { title: 'Дообучение', html: `<div class="content-card" data-editable="true"><h3>Раздел в разработке</h3></div>` },
      };

     const pages = { ...generalPages, ...window.fullPages || {}, ...window.installPages || {}, ...window.techPages || {} };

      async function loadFromFirebase() {
        try {
          const snapshot = await db.ref('pages').once('value');
          const data = snapshot.val();
          if (data) {
            for (const [key, value] of Object.entries(data)) {
              if (pages[key] && value) pages[key].html = value;
            }
          }
        } catch (error) {
          console.error('Ошибка загрузки:', error.message);
        }
      }

      async function saveToFirebase() {
        try {
          const card = document.querySelector('.content-card[data-editable="true"]');
          if (!card) {
            EDIT_STATUS.textContent = 'Нет редактируемого контента';
            setTimeout(() => { EDIT_STATUS.textContent = ''; }, 2000);
            return;
          }
          await db.ref('pages/' + currentPageId).set(card.innerHTML);
          EDIT_STATUS.textContent = 'Сохранено!';
          setTimeout(() => { EDIT_STATUS.textContent = ''; }, 2000);
        } catch (error) {
          console.error('Ошибка сохранения:', error.message);
          EDIT_STATUS.textContent = 'Ошибка: ' + error.message;
          setTimeout(() => { EDIT_STATUS.textContent = ''; }, 3000);
        }
      }

      function showPage(pageId) {
        currentPageId = pageId;
        const page = pages[pageId];
        if (!page) return;
        ROOT.innerHTML = page.html;
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        const activeBtn = document.querySelector(`.menu-item[data-page="${pageId}"]`);
        if (activeBtn) activeBtn.classList.add('active');
        if (pageId === 'templates') bindTemplateConstructor();
        if (isEditMode) enableEditMode();
        bindSearchInput();
      }

      function bindSearchInput() {
        const searchInput = document.getElementById('global-search');
        const suggestions = document.getElementById('suggestions');
        if (!searchInput || !suggestions) return;
        searchInput.addEventListener('input', () => {
          const query = searchInput.value.toLowerCase().trim();
          if (!query) { suggestions.classList.add('hidden'); return; }
          const results = [];
          for (const [id, page] of Object.entries(pages)) {
            if (page.title && page.title.toLowerCase().includes(query) || page.html && page.html.toLowerCase().includes(query)) {
              results.push({ id, title: page.title || 'Главная' });
            }
          }
          if (results.length) {
            suggestions.innerHTML = '';
            results.slice(0, 8).forEach(r => {
              const li = document.createElement('li');
              li.textContent = r.title;
              li.addEventListener('click', () => {
                showPage(r.id);
                suggestions.classList.add('hidden');
                searchInput.value = '';
              });
              suggestions.appendChild(li);
            });
            suggestions.classList.remove('hidden');
          } else {
            suggestions.classList.add('hidden');
          }
        });
      }

      function bindTemplateConstructor() {
        const courseSelect = document.getElementById('course-select');
        const moduleSelect = document.getElementById('module-select');
        const lessonSelect = document.getElementById('lesson-select');
        const templateOutput = document.getElementById('template-output');
        const copyTemplateBtn = document.getElementById('copy-template');
        if (!courseSelect || !moduleSelect || !lessonSelect) return;

        courseSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          moduleSelect.innerHTML = '<option value="">— Модуль —</option>';
          lessonSelect.innerHTML = '<option value="">— Урок —</option>';
          lessonSelect.disabled = true;
          moduleSelect.disabled = !course;
          if (course && window.templateData && window.templateData[course]) {
            Object.keys(window.templateData[course]).forEach(m => {
              const opt = document.createElement('option');
              opt.value = m; opt.textContent = m;
              moduleSelect.appendChild(opt);
            });
          }
        });

        moduleSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          const module = moduleSelect.value;
          lessonSelect.innerHTML = '<option value="">— Урок —</option>';
          lessonSelect.disabled = !module;
          if (course && module && window.templateData && window.templateData[course][module]) {
            Object.keys(window.templateData[course][module]).forEach(l => {
              const opt = document.createElement('option');
              opt.value = l; opt.textContent = l;
              lessonSelect.appendChild(opt);
            });
          }
        });

        lessonSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          const module = moduleSelect.value;
          const lesson = lessonSelect.value;
          templateOutput.textContent = (course && module && lesson && window.templateData && window.templateData[course][module][lesson])
            ? window.templateData[course][module][lesson] : 'Выберите курс, модуль и урок';
        });

        copyTemplateBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(templateOutput.textContent).then(() => {
            copyTemplateBtn.textContent = 'Скопировано';
            setTimeout(() => { copyTemplateBtn.textContent = 'Скопировать'; }, 1500);
          });
        });
      }

      function enableEditMode() {
        document.body.classList.add('edit-mode');
        document.querySelectorAll('.content-card[data-editable="true"]').forEach(card => {
          card.setAttribute('contenteditable', 'true');
        });
      }

      function disableEditMode() {
        document.body.classList.remove('edit-mode');
        document.querySelectorAll('.content-card').forEach(card => {
          card.removeAttribute('contenteditable');
        });
      }

      SAVE_CHANGES.addEventListener('click', saveToFirebase);
      TOGGLE_EDIT.addEventListener('click', () => {
        if (isEditMode) {
          disableEditMode();
          isEditMode = false;
          TOGGLE_EDIT.textContent = 'Редактировать';
        } else {
          enableEditMode();
          isEditMode = true;
          TOGGLE_EDIT.textContent = 'Просмотр';
        }
      });

      function login(code) {
        const role = ACCESS_CODES[code];
        if (!role) { LOGIN_ERROR.style.display = 'block'; return false; }
        currentRole = role;
        localStorage.setItem('userRole', role);
        LOGIN_OVERLAY.classList.add('hidden');
        updateRoleBadge();
        updateToolbar();
        LOGIN_ERROR.style.display = 'none';
        showPage('home');
        return true;
      }

      LOGIN_BTN.addEventListener('click', () => login(LOGIN_INPUT.value));
      LOGIN_INPUT.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(LOGIN_INPUT.value); });

      LOGOUT_BTN.addEventListener('click', () => {
        currentRole = null;
        isEditMode = false;
        disableEditMode();
        localStorage.removeItem('userRole');
        LOGIN_OVERLAY.classList.remove('hidden');
        LOGIN_INPUT.value = '';
        TOGGLE_EDIT.textContent = 'Редактировать';
        updateToolbar();
      });

      SIDEBAR.addEventListener('click', (e) => {
        const btn = e.target.closest('.menu-item');
        if (btn) showPage(btn.dataset.page);
      });

      (async function init() {
        await loadFromFirebase();
        if (currentRole) {
          showPage('home');
        } else {
          LOGIN_OVERLAY.classList.remove('hidden');
        }
      })();
    })();
  </script>
  <script src="data-full.js"></script>
</body>
</html>
