        'group': { title: 'Как проводить групповые уроки', html: `<div class="content-card" data-editable="true"><h3>Как проводить групповые уроки</h3><p><strong>Особенности группового урока</strong><br>Групповой урок — это совершенно другой формат, чем индивидуальное занятие. Здесь ваша задача — работать со всей группой одновременно, учитывая разные уровни подготовки и скорости работы. Это требует особых навыков и подходов.</p><p>Основные особенности группового урока:<br>Не все ученики работают с одинаковой скоростью. Кто-то быстрее, кто-то медленнее.<br>Кто-то активнее, кто-то пассивнее.<br>Нужно балансировать между всеми учениками, чтобы никто не чувствовал себя забытым.<br>В группе может быть от 2 до 12 учеников.<br>Нужно учитывать динамику группы: одни ученики могут доминировать, другие — замыкаться.</p><h4>Стратегия 1. Работайте со всей группой</h4><p>Нельзя посвящать всё время одному ученику. Урок должен быть ориентирован на группу в целом. Если один ученик отстаёт — помогите ему после урока или дайте индивидуальное задание. Ваша задача — держать всех в одном темпе, даже если это сложно.</p><p>Используйте техники, которые вовлекают всех одновременно: общие вопросы, опросы (в чате или устно), задания, которые можно выполнять параллельно. Например, задайте вопрос всей группе и попросите писать ответы в чат. Так вы видите, кто ответил, а кто нет, и можете скорректировать объяснение.</p><h4>Стратегия 2. Используйте парную работу</h4><p>Сажайте ученика с высоким уровнем рядом с учеником с низким уровнем. Сильный помогает слабому — это полезно обоим. Сильный ученик закрепляет свои знания, объясняя материал, а слабый получает индивидуальную помощь.</p><p>Важно: не делайте это наказанием. Сделайте парную работу добровольной или организованной в игровой форме. Например, «Сейчас вы будете работать в парах. Тот, кто сделает быстрее, помогает партнёру. Побеждает пара, где оба сделали правильно».</p><h4>Стратегия 3. Делайте общие демонстрации</h4><p>Показывайте на своём экране, ученики повторяют. Это позволяет держать всех в одном темпе. Общая демонстрация — это основа группового урока. Все видят одно и то же и могут задавать общие вопросы.</p><p>Важно: после демонстрации дайте время ученикам повторить самостоятельно. Не переходите к следующему шагу, пока большинство не справится. Если кто-то отстаёт, помогите ему индивидуально, но не останавливайте всю группу.</p><h4>Стратегия 4. Не ждите, что все сделают одновременно</h4><p>Кто-то сделает за 5 минут, кто-то за 15. Это нормально. Дайте дополнительное задание тем, кто сделал быстрее. Это может быть:<br>Усложнение текущего задания.<br>Задание на творчество (например, добавить декорации или дополнительные функции).<br>Помощь другим ученикам.<br>Изучение дополнительного материала.</p><p>Важно: у быстрых учеников всегда должно быть занятие, чтобы они не отвлекались и не мешали остальным.</p><h4>Стратегия 5. Контролируйте тайминг</h4><p>Групповой урок должен быть не менее 80 минут (для групп 2+ учеников). Если видите, что большинство отстаёт — упрощайте задание, сокращайте второстепенные элементы. Важно успеть выполнить основную цель урока.</p><p>Используйте таймер на экране, чтобы ученики видели, сколько времени осталось. Это помогает им управлять своим временем и не отвлекаться.</p><h4>Структура группового урока</h4><p>Вступление (5-10 минут) — приветствие, настройка на работу, повторение прошлого урока. Спросите, что запомнилось, что было сложно. Это помогает настроиться на урок.</p><p>Теория (15-20 минут) — новая тема, объяснение, демонстрация. Используйте наглядные материалы: презентации, примеры, демонстрации кода. Убедитесь, что все ученики понимают основные концепции.</p><p>Практика с преподавателем (20-25 минут) — делаете вместе, шаг за шагом. Ученики повторяют за вами, задают вопросы. Это основной этап, где формируются навыки.</p><p>Самостоятельная работа (20-25 минут) — ученики делают сами, вы помогаете индивидуально. Ходите по классу (или переключайтесь между учениками в онлайн-формате), отвечайте на вопросы, помогайте отстающим.</p><p>Заключение (5-10 минут) — обсуждение, вопросы, домашнее задание. Подведите итоги, похвалите учеников, дайте домашнее задание.</p><h4>Особые случаи</h4><p>Если группа слишком быстрая — не завершайте урок раньше времени. Дайте творческие задания, дополнительные уровни, усложнения. Можно предложить ученикам создать свой собственный проект на основе изученного материала.</p><p>Если группа слишком медленная — сокращайте объём работы, оставляя только самое важное. Суть темы должна быть передана в любом случае. Можно упростить задания или дать больше времени на их выполнение.</p><p>Если в группе есть явный лидер — используйте его для помощи другим. Дайте ему роль «помощника преподавателя». Это не только займёт его, но и создаст позитивную атмосферу в группе.</p><h4>Итог</h4><p>Групповой урок сложнее индивидуального, но и эффективнее. Ученики учатся друг у друга, создаётся здоровая конкуренция и атмосфера сотрудничества. Главное — удерживать баланс и вовлекать всех. Помните: ваша задача — не просто дать знания, а создать среду, где каждый ученик может развиваться в своём темпе, но при этом не чувствовать себя изолированным.</p></div>` },
        'motivation': { title: 'Как мотивировать учеников', html: `<div class="content-card" data-editable="true"><h3>Как мотивировать учеников</h3><p><strong>Почему ученики теряют мотивацию?</strong><br>Мотивация — это двигатель обучения. Без неё даже самый способный ученик не будет учиться. Вот основные причины, почему ученики теряют мотивацию:</p><p>Им скучно — задания однотипные, неинтересные, не соответствуют их возрасту или интересам. Они не видят связи между тем, что изучают, и реальной жизнью.</p><p>Они не видят результата — не понимают, зачем это нужно, где это пригодится. Им кажется, что они зря тратят время.</p><p>Они боятся ошибок — страх неудачи парализует. Они боятся выглядеть глупо, боятся критики.</p><p>Им не хватает внимания — чувствуют себя неважными, незамеченными. Они думают, что преподавателю всё равно на них.</p><p>Они не понимают материал — и отключаются. Когда материал слишком сложный, мозг защищается и переключается на что-то другое.</p><h4>Стратегия 1. Показывайте результат</h4><p>Ученики должны видеть, что у них получается. Показывайте прогресс: «Посмотри, что ты сделал за час!», «Ты начал с пустого экрана, а теперь у тебя целая игра!», «Твой код стал работать в два раза быстрее!». Делайте скриншоты проектов, показывайте, как они менялись от урока к уроку.</p><p>Ведите портфолио достижений каждого ученика. Это может быть папка с проектами или таблица с отметками о пройденных темах. Регулярно показывайте ученикам их прогресс — это мощный мотиватор.</p><h4>Стратегия 2. Связывайте с реальностью</h4><p>Объясняйте, зачем это нужно. «Этот навык пригодится тебе, когда ты будешь создавать свою игру», «Так работают все программы, которыми ты пользуешься», «Эти алгоритмы используют в банках, чтобы защищать деньги». Показывайте примеры из жизни: как программирование используется в профессиях, которые интересны ученикам.</p><p>Можно приглашать гостей — специалистов из IT-сферы, которые расскажут, как они используют программирование в своей работе. Это даёт ученикам реальный взгляд на будущее.</p><h4>Стратегия 3. Используйте игровые элементы</h4><p>Баллы, уровни, достижения — это работает. Сделайте систему накопления Кодкоинов, давайте звания, отмечайте успехи. Игровые элементы создают здоровую конкуренцию и делают обучение более увлекательным.</p><p>Можно создать «доску лидеров» в классе или в чате. Это стимулирует учеников стараться больше. Но важно: не создавайте слишком жёсткую конкуренцию, чтобы слабые ученики не чувствовали себя проигравшими.</p><h4>Стратегия 4. Начисляйте Кодкоины</h4><p>Кодкоины — это ваша внутренняя валюта. За выполнение заданий, за помощь другим, за активность. Это создаёт систему поощрений и даёт ученикам видимый результат их усилий.</p><p>Важно: система начисления должна быть прозрачной и понятной. Ученики должны знать, за что они получают Кодкоины, и сколько им нужно для получения приза.</p><h4>Стратегия 5. Хвалите публично и в личку</h4><p>Хвалите обязательно. Но хвалите конкретно: «Ты здорово продумал логику» вместо «ты молодец». Конкретная похвала показывает, что вы действительно заметили усилия ученика.</p><p>Используйте разные формы похвалы: публичную (в группе), личную (в чате), письменную (в комментариях к работам). Это создаёт атмосферу поддержки и признания.</p><h4>Стратегия 6. Давайте право выбора</h4><p>«Как ты хочешь сделать это задание?», «Какой проект ты хочешь делать?» — чувство контроля повышает мотивацию. Ученики ценят возможность выбора и чувствуют ответственность за свои решения.</p><p>Можно давать выбор в разных аспектах: тема проекта, формат выполнения (код, презентация, видео), уровень сложности. Чем больше выбора, тем выше вовлечённость.</p><h4>Стратегия 7. Используйте проектную работу</h4><p>Дайте ученикам возможность создавать что-то своё. Проекты, игры, приложения — это то, что их вдохновляет. Проектная работа даёт ощущение цели и смысла.</p><p>Важно: проекты должны быть реалистичными и достижимыми. Слишком сложные проекты могут демотивировать. Начинайте с маленьких проектов и постепенно усложняйте.</p><h4>Чего делать не стоит</h4><p>Не критикуйте личность — «ты ленивый», «ты неспособный». Критика личности разрушает самооценку и мотивацию.<br>Не сравнивайте — «вот Петя уже сделал, а ты нет». Сравнение создаёт напряжение и чувство неполноценности.<br>Не заставляйте — принуждение убивает мотивацию. Вместо принуждения используйте убеждение и поощрение.<br>Не используйте угрозы — это разрушает доверие. Угрозы создают страх, а не мотивацию.</p><h4>Итог</h4><p>Мотивация — это не волшебство, а система. Показывайте результат, связывайте с реальностью, используйте игровые элементы, хвалите и давайте выбор. Это работает. Помните: ваша задача — не просто научить, а вдохновить ученика на постоянное развитие.</p></div>` },
        'feedback': { title: 'Как давать обратную связь', html: `<div class="content-card" data-editable="true"><h3>Как давать обратную связь</h3><p><strong>Правило 1. Хвалите процесс, а не результат</strong><br>Вместо «ты сделал игру» скажите «ты отлично продумал логику движения врагов». Вместо «отлично» скажите «то, как ты организовал код — это очень грамотно». Обратная связь на процесс показывает, что вы цените усилия, а не только конечный результат.</p><p>Это особенно важно для слабых учеников. Они могут не достичь идеального результата, но если вы похвалите их процесс, они будут чувствовать, что их усилия замечены и ценятся.</p><p><strong>Правило 2. Будьте конкретными</strong><br>Конкретика работает лучше общих фраз. Вместо «хорошо» скажите «здорово, что ты использовал циклы здесь — это правильное решение». Конкретная обратная связь показывает, что вы действительно смотрели работу и заметили детали.</p><p>Старайтесь давать обратную связь по 2-3 конкретным моментам: что сделано хорошо, что можно улучшить, как это улучшить. Это структурирует обратную связь и делает её полезной.</p><p><strong>Правило 3. Указывайте на ошибки конструктивно</strong><br>Не говорите «неправильно», скажите «здесь есть небольшая ошибка, давай посмотрим, что можно исправить». Конструктивная критика — это не «что плохо», а «как сделать лучше».</p><p>Предлагайте решения, а не просто указывайте на ошибки. Например: «Здесь ошибка в условии. Попробуй поменять знак с > на < — тогда код будет работать правильно».</p><p><strong>Правило 4. Хвалите до критики</strong><br>Сначала положительное, потом — что можно улучшить. Это называется «сэндвич-метод»: похвала → критика → похвала. Например: «Отлично, ты правильно использовал циклы. Есть небольшая ошибка в условии, давай исправим. А вообще — отличный прогресс за сегодня!».</p><p>Этот метод работает, потому что ученик не чувствует себя «плохим» после критики. Он видит, что вы цените его усилия и верите в его способности.</p><p><strong>Правило 5. Задавайте наводящие вопросы</strong><br>Вместо «ты понял, как это работает?» спросите «как ты думаешь, что здесь происходит?», «почему этот код работает именно так?». Наводящие вопросы стимулируют мышление и помогают ученику самостоятельно найти решение.</p><p>Они также показывают, что вы уважаете способности ученика и верите, что он может разобраться сам.</p><p><strong>Правило 6. Завершайте на позитиве</strong><br>Всегда оставляйте ученика с хорошим настроением. Даже если есть ошибки, последние слова должны быть поддерживающими. Например: «Ты проделал большую работу. Есть над чем поработать, но я уверен, что у тебя получится».</p><p>Позитивное завершение создаёт ощущение успеха и мотивацию двигаться дальше.</p><h4>Примеры хорошей обратной связи</h4><p>«Отлично, ты включил демонстрацию экрана — молодец. Смотри, код в целом правильный, ты хорошо поработал, но вот здесь небольшая ошибка, которая мешает. Давай поправим вот так. А вообще — отличный прогресс за сегодня!»</p><p>«Ты отлично справился с логикой игры. Здорово, что ты использовал функции для повторяющихся действий. Единственное, что можно улучшить — это оптимизировать код, убрав лишние проверки. Попробуй переписать этот участок. Но в целом — очень хорошая работа!»</p><h4>Примеры плохой обратной связи</h4><p>«Неправильно, делай заново». «Ты что, не понимаешь, как это работает?» «Вот Маша сделала лучше».</p><h4>Чего делать не стоит</h4><p>Не используйте пустые фразы — «молодец» без конкретики не работает. Ученик не понимает, что именно он сделал хорошо.<br>Не критикуйте личность — не «ты невнимательный», а «в этом месте есть неточность». Критика личности разрушает самооценку.<br>Не сравнивайте — «вот Маша сделала лучше». Сравнение создаёт напряжение и чувство неполноценности.<br>Не давайте обратную связь при всех, если это критика — это унижает ученика и создаёт страх ошибки.</p><h4>Итог</h4><p>Обратная связь — это инструмент роста. Конкретная, позитивная, конструктивная — она помогает ученику двигаться вперёд и чувствовать поддержку. Помните: ваша задача — не просто оценить, а помочь ученику стать лучше.</p></div>` },
        'late': { title: 'Что делать если ученик опоздал', html: `<div class="content-card" data-editable="true"><h3>Что делать, если ученик опоздал</h3><p><strong>Если опоздание до 15 минут</strong><br>Впустите ученика, дайте ему ссылку на материалы и скажите: «Мы сейчас делаем то-то, давай включайся». Не останавливайте урок ради одного опоздавшего. Ваша задача — продолжать урок, а ученик должен адаптироваться к текущему моменту.</p><p>Если возможно, отправьте опоздавшему ученику в чат краткое резюме того, что было в начале урока: «Мы уже прошли теорию, сейчас практика. Вот ссылка на слайды». Это поможет ему быстрее включиться.</p><p><strong>Если опоздание 15-30 минут</strong><br>Ученик уже пропустил важную часть. Дайте ему краткий текст или скриншоты, объясните суть за 2 минуты. Скажите: «Мы уже прошли теорию, сейчас практика. Вот что мы сделали — давай включайся». Не тратьте время всей группы на объяснение одному ученику.</p><p>Если возможно, предложите ученику присоединиться к практической части, а теорию разобрать после урока индивидуально. Это позволит ему не отставать от группы.</p><p><strong>Если опоздание более 30 минут</strong><br>Вы уже успели начать практическую работу по новой теме и понимаете, что этот ученик задержит всю группу, если будет догонять. Вежливо объясните ему, что сегодня он будет зрителем и выполнит работу по записи урока, которую вы отправите.</p><p>Скажите: «Саша, мы уже далеко ушли, и я боюсь, что ты не успеешь всё сделать. Давай ты сегодня посмотришь, как мы работаем, а после урока я пришлю тебе запись, и ты сделаешь задание самостоятельно. Если будут вопросы — я помогу». Это сохраняет достоинство ученика и не тормозит группу.</p><p><strong>Если опоздания систематические</strong><br>Проведите с учеником профилактическую беседу, объясняя все последствия его опозданий. Спросите: «Я заметил, что ты часто опаздываешь. В чём причина? Может быть, я могу помочь?». Если не помогает — обратитесь к его родителям.</p><p>Важно: не делайте это публичным. Обсуждайте проблему наедине, чтобы не унижать ученика. Если вы видите, что опоздания связаны с техническими проблемами (например, не может подключиться к Контур.Толк), помогите их решить.</p><h4>Важно</h4><p>Не делайте замечание при всей группе — это унижает ученика и создаёт напряжение. Замечание должно быть личным и деликатным.<br>Не начинайте урок заново из-за опоздавшего — это несправедливо по отношению к тем, кто пришёл вовремя.<br>Не ставьте оценку за опоздание — это не относится к учебным достижениям.<br>Если ученик опоздал, но активно работает — это уже хорошо. Он старается наверстать упущенное, и это заслуживает поддержки, а не критики.</p><h4>Итог</h4><p>Опоздания — это неизбежная часть работы преподавателя. Важно реагировать на них спокойно и конструктивно, не нарушая ход урока и не унижая ученика. Помните: ваша задача — создать комфортную среду для обучения, даже если ученики иногда опаздывают.</p></div>` },
        'ignore': { title: 'Ученик игнорирует преподавателя', html: `<div class="content-card" data-editable="true"><h3>Ученик игнорирует преподавателя</h3><p><strong>Признаки проблемы</strong><br>Ученик игнорирует преподавателя — это одна из самых сложных ситуаций. Вот основные признаки:</p><p>Ученик не отвечает на вопросы, даже когда вы обращаетесь к нему напрямую.<br>Не просит помощи, даже когда нуждается.<br>Не выполняет задания или делает их небрежно.<br>Выключил камеру и микрофон (в онлайн-формате) и молчит.<br>Не реагирует на обращения по имени.</p><h4>Алгоритм действий</h4><p><strong>Шаг 1. Узнайте причину</strong><br>Свяжитесь с родителями: «Я заметил, что Саша на уроке молчит. У него всё в порядке? Может быть, технические проблемы?». Иногда проблема может быть на стороне родителей или в технических неполадках.<br>Если технические проблемы исключены, спросите ученика напрямую (в личном чате): «Я заметил, что ты сегодня не отвечаешь. Всё в порядке? Может быть, я могу тебе помочь?».</p><p><strong>Шаг 2. Предложите индивидуальный подход</strong><br>Скажите ученику в личку: «Я вижу, что тебе сложно говорить при всех. Может быть, я могу тебе помочь в личном чате?». Это даёт ученику безопасное пространство для общения.<br>Можно также предложить альтернативные формы участия: письменные ответы в чате, индивидуальные консультации после урока.</p><p><strong>Шаг 3. Настройте контакт отдельным разговором</strong><br>Выделите +10 минут в конце урока, чтобы ребёнок воспринимал вас как друга. Рабочий приём в таком разговоре — выслушать жизненные интересы и соединить их с проектом. Например: «Я знаю, что ты любишь футбол. Хочешь, мы сделаем футбольную игру?».<br>Это создаёт личную связь и показывает ученику, что вы видите в нём человека, а не просто ученика.</p><p><strong>Шаг 4. Проверьте техническую сторону</strong><br>Возможно, у ребёнка нет микрофона и камеры или он не может их настроить. Предложите подключиться в ЛС за 5 минут до урока, чтобы всё настроить вместе. Иногда проблема не в желании, а в возможностях.</p><p><strong>Шаг 5. Если ничего не помогает</strong><br>Обратитесь к руководителю или психологу школы. Это может быть признаком более серьёзных проблем, которые требуют профессиональной помощи.</p><h4>Чего делать не стоит</h4><p>Не игнорируйте проблему — она не решится сама. Игнорирование только усугубит ситуацию.<br>Не делайте замечания при всех — это усугубит ситуацию. Ученик замкнётся ещё больше.<br>Не давите на ученика — это вызовет сопротивление. Давление создаёт стресс, а не мотивацию.<br>Не ставьте ультиматумы — это разрушает доверие. Ультиматумы создают враждебную атмосферу.</p><h4>Итог</h4><p>Игнорирование — это всегда сигнал о проблеме. Ваша задача — понять причину и помочь ученику. Терпение, индивидуальный подход и поддержка помогут восстановить контакт.</p></div>` },
        'mixed-levels': { title: 'Разные уровни подготовки в группе', html: `<div class="content-card" data-editable="true"><h3>Разные уровни подготовки в группе</h3><p><strong>Стратегия 1. Давайте задания с разной сложностью</strong><br>Базовое задание — для всех. Дополнительное — для сильных. Упрощённое — для слабых. Пример: задание «Сделай игру» можно разбить:<br>Базовое: двигающийся персонаж (для всех).<br>Сложное: враги и препятствия (для сильных).<br>Дополнительное: несколько уровней и босс (для самых сильных).</p><p>Это позволяет каждому ученику работать на своём уровне и чувствовать успех.</p><p><strong>Стратегия 2. Используйте пары</strong><br>Сильный + слабый = отличная комбинация. Сильный объясняет, слабый учится. Но не делайте это постоянно — иногда давайте задания индивидуально, чтобы каждый развивался в своём темпе.</p><p>Важно: меняйте пары регулярно, чтобы ученики не привыкали к одному партнёру и учились работать с разными людьми.</p><p><strong>Стратегия 3. Не ждите, что все закончат одновременно</strong><br>Это главная ошибка. Не ставьте урок в зависимость от самого медленного ученика. Давайте дополнительное задание тем, кто закончил быстрее. Это сохраняет темп и не даёт сильным ученикам скучать.</p><p><strong>Стратегия 4. Индивидуальные консультации</strong><br>Если ученик совсем отстаёт, назначьте ему индивидуальную консультацию или отработку. Это позволяет разобрать материал в спокойной обстановке без давления группы.</p><p><strong>Стратегия 5. Регулярно проверяйте понимание</strong><br>Задавайте вопросы, делайте быстрые тесты, просите показать код. Это помогает понять, кто отстаёт, а кто опережает. Регулярная проверка позволяет своевременно корректировать программу.</p><h4>Итог</h4><p>Разноуровневая группа — это вызов, но и возможность. Правильная дифференциация заданий и индивидуальный подход помогают вовлечь всех. Помните: ваша задача — чтобы каждый ученик чувствовал себя успешным.</p></div>` },
        'attention': { title: 'Управление вниманием на уроке', html: `<div class="content-card" data-editable="true"><h3>Управление вниманием на уроке</h3><p><strong>Метод 1. Вовлекайте в диалог</strong><br>Не ведите монолог. Задавайте вопросы каждые 3-5 минут: «Как думаешь?», «Что будет дальше?», «Почему это работает так?». Диалог держит внимание и делает урок интерактивным.</p><p><strong>Метод 2. Меняйте активность</strong><br>Теория → практика → обсуждение → игра. Смена деятельности не даёт вниманию рассеяться. Каждый новый вид активности требует переключения, что освежает восприятие.</p><p><strong>Метод 3. Обращайтесь по имени</strong><br>Когда вы называете ученика по имени, он чувствует себя вовлечённым. «Саша, как ты думаешь?». Это привлекает внимание и показывает, что вы видите каждого ученика.</p><p><strong>Метод 4. Используйте визуальные материалы</strong><br>Картинки, схемы, примеры — они привлекают внимание лучше слов. Визуальные материалы помогают удерживать внимание и делают информацию более доступной.</p><p><strong>Метод 5. Делайте короткие перерывы</strong><br>5-минутная разминка, дыхательное упражнение или просто «встаньте и потянитесь» — это восстанавливает внимание. Перерывы особенно важны для младших школьников.</p><p><strong>Метод 6. Используйте неожиданные вопросы</strong><br>Неожиданный вопрос возвращает внимание: «А что было бы, если бы здесь не было цикла?». Неожиданность заставляет мозг активизироваться.</p><p><strong>Метод 7. Связывайте с жизнью</strong><br>Приводите примеры из реальной жизни. Дети лучше понимают и запоминают, когда видят связь с тем, что им знакомо. Например: «Как ты думаешь, как работает поиск в Google? Это те же алгоритмы, которые мы изучаем».</p><h4>Итог</h4><p>Внимание — это ресурс, который нужно экономить. Диалог, смена активностей и визуальные материалы помогают удерживать внимание на всём уроке.</p></div>` },
        'crying': { title: 'Что делать если ученик заплакал', html: `<div class="content-card" data-editable="true"><h3>Что делать, если ребёнок заплакал на уроке</h3><p><strong>Почему дети плачут на уроке?</strong><br>Фрустрация от неудачи — ребёнок не может выполнить задание, код не работает, он чувствует себя беспомощным. Это самая частая причина.<br>Усталость — дети устают быстрее взрослых. Особенно к концу недели или после насыщенного дня в школе.<br>Личные проблемы — домашние конфликты, проблемы в школе, ссоры с друзьями.<br>Чувство несправедливости — если ребёнок считает, что его несправедливо оценили или обидели.<br>Сравнение с другими — когда ребёнок видит, что другие делают лучше, и чувствует себя неспособным.<br>Страх ошибки — боязнь сделать что-то неправильно и получить негативную реакцию.</p><h4>Алгоритм действий</h4><p><strong>Шаг 1. Заметить и не игнорировать</strong><br>Не делайте вид, что ничего не происходит. Заметить, что ребёнок расстроен — уже половина решения. Если вы видите, что ученик плачет, сразу реагируйте.</p><p><strong>Шаг 2. Переключиться в личный чат</strong><br>Никогда не обсуждайте эмоциональное состояние ребёнка при всей группе. Переключитесь в личный чат или скажите: «Саша, давай на минутку отойдём, я хочу тебе помочь».</p><p><strong>Шаг 3. Спросите спокойным голосом</strong><br>«Я вижу, что ты расстроен. Что случилось?», «Ты хочешь поделиться, что произошло?», «Может быть, я могу тебе помочь?». Говорите мягко, без давления. Не требуйте ответа сразу — ребёнок может не быть готов говорить.</p><p><strong>Шаг 4. Примите эмоцию</strong><br>Если ребёнок говорит, что ему сложно или он злится — примите это. Скажите: «Я понимаю, это действительно сложно», «Ты имеешь право расстраиваться, если что-то не получается». Не обесценивайте чувства ребёнка.</p><p><strong>Шаг 5. Предложите решение</strong><br>«Давай попробуем разобраться вместе», «Я помогу тебе сделать это задание по шагам», «Может быть, тебе нужно отдохнуть 5 минут?». Дайте ребёнку выбор: «Ты хочешь, чтобы я помог, или хочешь подумать сам?».</p><p><strong>Шаг 6. Дайте время успокоиться</strong><br>Иногда ребёнку нужно просто выплакаться. Не торопите его, не говорите «хватит плакать». Дайте ему время. Скажите: «Я подожду, когда ты будешь готов».</p><p><strong>Шаг 7. После урока свяжитесь с родителями</strong><br>Если ребёнок сильно плакал, напишите родителям: «Саша сегодня расстроился на уроке, ему было сложно с заданием. Я помог ему, но, возможно, стоит обсудить это дома».</p><h4>Чего делать не стоит</h4><p>Не игнорируйте — ребёнок чувствует себя брошенным.<br>Не стыдите — не говорите: «Ты же взрослый, перестань плакать».<br>Не обесценивайте — не говорите: «Ерунда, не расстраивайся».<br>Не давайте советов, пока ребёнок плачет — сначала дайте выплакаться, потом помогайте.<br>Не делайте это публичным — не обсуждайте при всех.<br>Не говорите «возьми себя в руки» — ребёнок и так старается.</p><h4>Итог</h4><p>Плач на уроке — это не катастрофа. Это сигнал, что ребёнку нужна поддержка. Ваше спокойствие, принятие и готовность помочь помогут ребёнку справиться с эмоциями и вернуться к работе. Помните: дети запоминают не столько то, что вы им рассказали, сколько то, как вы с ними обращались в трудную минуту.</p></div>` },
        'training': { title: 'Дообучение', html: `<div class="content-card" data-editable="true"><h3>Раздел в разработке</h3></div>` },
      };

      // Объединяем все данные
      const pages = {
        ...generalPages,
        ...window.installPages || {},
        ...window.techPages || {},
      };

      // ===== ЗАГРУЗКА ДАННЫХ ИЗ FIREBASE =====
      async function loadFromFirebase() {
        try {
          const docRef = await db.collection('pages').doc('content').get();
          if (docRef.exists) {
            const data = docRef.data();
            for (const [key, value] of Object.entries(data)) {
              if (pages[key]) {
                pages[key].html = value.html;
              }
            }
          }
        } catch (error) {
          console.error('Ошибка загрузки из Firebase:', error);
        }
      }

      // ===== СОХРАНЕНИЕ В FIREBASE =====
      async function saveToFirebase() {
        try {
          const dataToSave = {};
          document.querySelectorAll('.content-card[data-editable="true"]').forEach(card => {
            dataToSave[currentPageId] = { html: card.innerHTML };
          });
          await db.collection('pages').doc('content').set(dataToSave, { merge: true });
          EDIT_STATUS.textContent = 'Сохранено в облако';
          setTimeout(() => { EDIT_STATUS.textContent = ''; }, 2000);
        } catch (error) {
          console.error('Ошибка сохранения в Firebase:', error);
          EDIT_STATUS.textContent = 'Ошибка сохранения';
        }
      }

      // Функция отображения страницы
      function showPage(pageId) {
        currentPageId = pageId;
        const page = pages[pageId];
        if (!page) return;
        ROOT.innerHTML = page.html;
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        const activeBtn = document.querySelector(`.menu-item[data-page="${pageId}"]`);
        if (activeBtn) activeBtn.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (pageId === 'templates') bindTemplateConstructor();
        if (isEditMode) enableEditMode();
        bindSearchInput();
      }

      // Привязка поиска
      function bindSearchInput() {
        const searchInput = document.getElementById('global-search');
        const suggestions = document.getElementById('suggestions');
        if (!searchInput || !suggestions) return;
        searchInput.addEventListener('input', () => {
          const query = searchInput.value.toLowerCase().trim();
          if (!query) { suggestions.classList.add('hidden'); return; }
          const results = [];
          for (const [id, page] of Object.entries(pages)) {
            if (page.title && page.title.toLowerCase().includes(query) || page.html && page.html.toLowerCase().includes(query)) {
              results.push({ id, title: page.title || 'Главная' });
            }
          }
          if (results.length) {
            suggestions.innerHTML = '';
            results.slice(0, 8).forEach(r => {
              const li = document.createElement('li');
              li.textContent = r.title;
              li.addEventListener('click', () => {
                showPage(r.id);
                suggestions.classList.add('hidden');
                searchInput.value = '';
              });
              suggestions.appendChild(li);
            });
            suggestions.classList.remove('hidden');
          } else {
            suggestions.classList.add('hidden');
          }
        });
      }

      // Функция для работы с шаблонными сообщениями
      function bindTemplateConstructor() {
        const courseSelect = document.getElementById('course-select');
        const moduleSelect = document.getElementById('module-select');
        const lessonSelect = document.getElementById('lesson-select');
        const templateOutput = document.getElementById('template-output');
        const copyTemplateBtn = document.getElementById('copy-template');
        if (!courseSelect || !moduleSelect || !lessonSelect) return;

        courseSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          moduleSelect.innerHTML = '<option value="">— Модуль —</option>';
          lessonSelect.innerHTML = '<option value="">— Урок —</option>';
          lessonSelect.disabled = true;
          moduleSelect.disabled = !course;
          templateOutput.textContent = 'Выберите курс, модуль и урок';
          if (course && window.templateData && window.templateData[course]) {
            Object.keys(window.templateData[course]).forEach(m => {
              const opt = document.createElement('option');
              opt.value = m; opt.textContent = m;
              moduleSelect.appendChild(opt);
            });
          }
        });

        moduleSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          const module = moduleSelect.value;
          lessonSelect.innerHTML = '<option value="">— Урок —</option>';
          lessonSelect.disabled = !module;
          templateOutput.textContent = 'Выберите курс, модуль и урок';
          if (course && module && window.templateData && window.templateData[course][module]) {
            Object.keys(window.templateData[course][module]).forEach(l => {
              const opt = document.createElement('option');
              opt.value = l; opt.textContent = l;
              lessonSelect.appendChild(opt);
            });
          }
        });

        lessonSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          const module = moduleSelect.value;
          const lesson = lessonSelect.value;
          templateOutput.textContent = (course && module && lesson && window.templateData && window.templateData[course][module][lesson])
            ? window.templateData[course][module][lesson]
            : 'Выберите курс, модуль и урок';
        });

        copyTemplateBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(templateOutput.textContent).then(() => {
            copyTemplateBtn.textContent = 'Скопировано';
            setTimeout(() => { copyTemplateBtn.textContent = 'Скопировать текст'; }, 1500);
          });
        });
      }

      // Включение режима редактирования
      function enableEditMode() {
        document.body.classList.add('edit-mode');
        document.querySelectorAll('.content-card[data-editable="true"]').forEach(card => {
          card.setAttribute('contenteditable', 'true');
        });
      }

      // Выключение режима редактирования
      function disableEditMode() {
        document.body.classList.remove('edit-mode');
        document.querySelectorAll('.content-card').forEach(card => {
          card.removeAttribute('contenteditable');
        });
      }

      // Сохранение изменений
      SAVE_CHANGES.addEventListener('click', saveToFirebase);

      // Переключение режима редактирования
      TOGGLE_EDIT.addEventListener('click', () => {
        if (isEditMode) {
          disableEditMode();
          isEditMode = false;
          TOGGLE_EDIT.textContent = 'Редактировать';
        } else {
          enableEditMode();
          isEditMode = true;
          TOGGLE_EDIT.textContent = 'Просмотр';
        }
      });

      // Вход
      function login(code) {
        const role = ACCESS_CODES[code];
        if (!role) {
          LOGIN_ERROR.style.display = 'block';
          return false;
        }
        currentRole = role;
        LOGIN_OVERLAY.classList.add('hidden');
        ROLE_BADGE.textContent = role === 'admin' ? 'Руководитель' : 'Преподаватель';
        ROLE_BADGE.className = 'role-badge' + (role === 'admin' ? ' admin' : '');
        if (role === 'admin') {
          EDIT_TOOLBAR.classList.add('visible');
        } else {
          EDIT_TOOLBAR.classList.remove('visible');
        }
        LOGIN_ERROR.style.display = 'none';
        showPage('home');
        return true;
      }

      LOGIN_BTN.addEventListener('click', () => {
        login(LOGIN_INPUT.value);
      });

      LOGIN_INPUT.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login(LOGIN_INPUT.value);
      });

      // Выход
      LOGOUT_BTN.addEventListener('click', () => {
        currentRole = null;
        isEditMode = false;
        disableEditMode();
        LOGIN_OVERLAY.classList.remove('hidden');
        LOGIN_INPUT.value = '';
        TOGGLE_EDIT.textContent = 'Редактировать';
      });

      // Обработка кликов по меню
      SIDEBAR.addEventListener('click', (e) => {
        const btn = e.target.closest('.menu-item');
        if (btn) showPage(btn.dataset.page);
      });

      // Инициализация — показываем экран входа сразу
      LOGIN_OVERLAY.classList.remove('hidden');
    })();
  </script>
</body>
</html>
